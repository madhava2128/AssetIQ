name: AssetIQ CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          cd apps/web
          npm ci || npm install
      - name: Run Web Tests
        run: |
          cd apps/web
          npm test --if-present

  test-ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd services/ml
          pip install -r requirements.txt || true
      - name: Run ML Tests
        run: |
          cd services/ml
          pytest || true
